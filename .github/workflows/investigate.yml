name: investigate

# Deterministic cold-lead scanner. Pulls free public datasets, flags anomalies
# with no model, and commits a short candidate list to state/investigations/.
# The point: the grinding runs here on the free runner, on a schedule, even
# with the operator's PC off -- so the frontier session spends its tokens on
# JUDGMENT (the Westen test over the few flagged), not on re-mining raw data.

on:
  schedule:
    - cron: "30 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: investigate
  cancel-in-progress: false

jobs:
  investigate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: live

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scan public records for anomalies
        run: python -m aletheia.investigations

      - name: Commit candidate anomalies
        run: |
          git config user.name "aletheia-investigate"
          git config user.email "actions@users.noreply.github.com"
          git add state/investigations
          if git diff --cached --quiet; then
            echo "no change in candidates — nothing to commit"
          else
            git commit -m "investigate: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin live
            git push origin live
          fi
