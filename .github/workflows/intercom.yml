name: intercom

# Executes operator commands relayed by ChatGPT (exchange/commands/*.json):
# validate -> registry gates -> execute -> receipt (+ journal). Fires on the
# push the ChatGPT connector makes; results are committed with the default
# token, whose pushes do not re-trigger workflows (no loop).

on:
  push:
    branches: [main]
    paths: ["exchange/commands/**"]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: intercom
  cancel-in-progress: false

jobs:
  intercom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Execute pending commands
        env:
          FLEET_TOKEN: ${{ secrets.FLEET_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m aletheia.intercom run

      - name: Commit receipts + journal
        run: |
          git config user.name "aletheia-intercom"
          git config user.email "actions@users.noreply.github.com"
          git add exchange/commands state
          if git diff --cached --quiet; then
            echo "nothing executed"
          else
            git commit -m "intercom: receipts $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push origin main
          fi
