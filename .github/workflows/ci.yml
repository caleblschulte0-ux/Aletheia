name: ci

on:
  push:
    branches: [main]
    # the PC Core pushes state checkpoints ~200x/day; a push touching ONLY
    # run-state must not re-run the whole suite. A push mixing code + state
    # still runs (paths-ignore skips only when every changed file matches).
    paths-ignore:
      - "state/**"
      - "exchange/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install browser test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-optional.txt
          python -m playwright install --with-deps chromium

      - name: Fleet registry validates
        run: python -m aletheia.fleet --validate

      - name: Capability registry validates
        run: python -m aletheia.capabilities --validate

      - name: ChatGPT inbox validates
        run: python -m aletheia.suggestions validate

      - name: Plans validate
        run: python -m aletheia.plans validate

      - name: Tests
        run: python -m unittest discover -s tests -t . -v
