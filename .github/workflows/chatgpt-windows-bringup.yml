name: chatgpt-windows-bringup

on:
  pull_request:
    branches: [main]
    paths:
      - "aletheia/**"
      - "tests/**"
      - "scripts/**"
      - "requirements-optional.txt"
      - ".github/workflows/chatgpt-windows-bringup.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-full-suite:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install required Windows runtime dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check tzdata

      - name: Install optional browser dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements-optional.txt
          python -m playwright install chromium

      - name: Registry validation
        shell: pwsh
        run: |
          python -m aletheia.fleet --validate
          python -m aletheia.capabilities --validate
          python -m aletheia.suggestions validate
          python -m aletheia.plans validate

      - name: Full Windows test suite
        shell: pwsh
        run: python -m unittest discover -s tests -t . -v
