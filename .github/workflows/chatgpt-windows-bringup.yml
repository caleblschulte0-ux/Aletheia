name: chatgpt-windows-bringup

on:
  pull_request:
    branches: [live, main]
    paths:
      - "aletheia/**"
      - "tests/**"
      - "scripts/**"
      - "requirements-optional.txt"
      - ".github/workflows/chatgpt-windows-bringup.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-full-suite:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # WINDOWS POWERSHELL 5.1, from disk, every script. The operator's PC
      # runs `powershell`, not `pwsh`: 5.1 reads a BOM-less file as the ANSI
      # code page, so an em dash (E2 80 94) became a closing quote and the
      # bring-up failed to PARSE on his machine while this step, run under
      # pwsh, stayed green. The scripts are held to pure ASCII by
      # tests/test_windows_bringup_script.py; this is the live proof.
      - name: Parse every operator PowerShell script with Windows PowerShell 5.1
        shell: powershell
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem -Path scripts -Filter *.ps1) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "::error file=scripts/$($file.Name)::parse errors: $($errors -join '; ')"
            } else {
              Write-Host "parsed scripts/$($file.Name) with $($PSVersionTable.PSVersion)"
            }
          }
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            Write-Host "::error::this step must run under Windows PowerShell 5.1, the operator's shell"
            $failed = $true
          }
          if ($failed) { exit 1 }

      - name: Install required Windows runtime dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check tzdata

      - name: Install optional browser dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements-optional.txt
          python -m playwright install chromium

      - name: Registry validation
        shell: pwsh
        run: |
          python -m aletheia.fleet --validate
          python -m aletheia.capabilities --validate
          python -m aletheia.suggestions validate
          python -m aletheia.plans validate

      - name: Full Windows test suite
        shell: pwsh
        run: python -m unittest discover -s tests -t . -v
