name: pages

# Publishes THE WALL to GitHub Pages — and enables Pages itself on first
# run (actions/configure-pages enablement), so the operator never has to
# touch repository settings.
#
# Published surface is deliberately narrow: the wall + the pulse JSON it
# reads. The Command Center is NOT published — it is a command surface and
# belongs only to the loopback-bound local Core.

on:
  workflow_run:
    workflows: [pulse]
    types: [completed]
  push:
    branches: [main]
    paths: ["interface/**", "state/pulse/latest.json", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Assemble the published site (wall + pulse only)
        run: |
          mkdir -p site/interface site/state/pulse
          cp interface/index.html site/interface/index.html
          cp state/pulse/latest.json site/state/pulse/latest.json
          # root redirect so the bare Pages URL lands on the wall
          cat > site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8">
          <title>ALETHEIA</title>
          <meta http-equiv="refresh" content="0; url=./interface/">
          <body style="background:#04060b;color:#dfe6f2;font-family:system-ui;
                       display:grid;place-items:center;height:100vh;margin:0">
            <a href="./interface/" style="color:#62d0e8;letter-spacing:.4em;
               text-decoration:none">ALETHEIA →</a>
          </body>
          HTML

      # Tries to enable Pages itself. GitHub blocks site CREATION for the
      # default workflow token ("Resource not accessible by integration"),
      # so this legitimately needs one operator toggle the first time. We
      # wait politely instead of failing red forever: once Pages is on with
      # Source = GitHub Actions, every later run deploys normally.
      - id: configure
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - name: Pages not enabled yet — say exactly what to do, then stop
        if: steps.configure.outcome != 'success'
        run: |
          echo "::notice title=Pages not enabled::Turn it on once: repo Settings -> Pages -> Source: GitHub Actions. Then re-run this workflow and the wall goes live at https://caleblschulte0-ux.github.io/Aletheia/"
          echo "Pages is not enabled on this repository yet — nothing deployed."
          echo "This is not a build failure; it is a one-time setting."

      - uses: actions/upload-pages-artifact@v3
        if: steps.configure.outcome == 'success'
        with:
          path: site

      - id: deployment
        if: steps.configure.outcome == 'success'
        uses: actions/deploy-pages@v4
