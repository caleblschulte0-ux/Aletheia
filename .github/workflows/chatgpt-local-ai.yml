name: ChatGPT Local AI Branch Validation

on:
  push:
    branches:
      - chatgpt/local-ai-brain-v1
  pull_request:
    paths:
      - 'aletheia/local_brain.py'
      - 'aletheia/brain_router.py'
      - 'aletheia/model_config.py'
      - 'aletheia/model_pool_config.py'
      - 'aletheia/local_model_pool.py'
      - 'aletheia/reasoning_gateway.py'
      - 'aletheia/local_ai_bridge.py'
      - 'aletheia/training_data.py'
      - 'aletheia/training_cli.py'
      - 'tests/test_local_brain.py'
      - 'tests/test_brain_router.py'
      - 'tests/test_model_config.py'
      - 'tests/test_model_pool_config.py'
      - 'tests/test_local_model_pool.py'
      - 'tests/test_reasoning_gateway.py'
      - 'tests/test_local_ai_bridge.py'
      - 'tests/test_training_data.py'
      - 'scripts/setup-local-ai.ps1'
      - 'scripts/setup-local-ai-pool.ps1'
      - 'docs/LOCAL_AI.md'
      - 'CHATGPT_LOCAL_AI_HANDOFF.md'
      - 'CHATGPT_TWO_TIER_LOCAL_AI_INTEGRATION.md'
      - 'CHATGPT_REASONING_GATEWAY_INTEGRATION.md'

permissions:
  contents: read

jobs:
  local-ai-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile prototype modules
        run: >-
          python -m py_compile
          aletheia/local_brain.py
          aletheia/brain_router.py
          aletheia/model_config.py
          aletheia/model_pool_config.py
          aletheia/local_model_pool.py
          aletheia/reasoning_gateway.py
          aletheia/local_ai_bridge.py
          aletheia/training_data.py
          aletheia/training_cli.py
      - name: Run isolated local AI tests
        run: >-
          python -m unittest
          tests.test_local_brain
          tests.test_brain_router
          tests.test_model_config
          tests.test_model_pool_config
          tests.test_local_model_pool
          tests.test_reasoning_gateway
          tests.test_local_ai_bridge
          tests.test_training_data
