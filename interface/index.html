<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALETHEIA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* Committed single look: this page is a wall projection. Deep-space dark,
     always. Status is never color-alone — every dot travels with a word. */
  :root {
    --bg: #04060b;
    --panel: rgba(13, 18, 28, 0.78);
    --line: rgba(96, 118, 156, 0.20);
    --line-bright: rgba(120, 150, 200, 0.38);
    --ink: #dfe6f2;
    --muted: #7d8aa3;
    --faint: #4a5670;
    --accent: #62d0e8;
    --accent2: #7c96ff;
    --ok: #35d07f;
    --bad: #ff5d5d;
    --warn: #d9a53f;
    --unknown: #8b93a0;
    --sans: "Space Grotesk", system-ui, -apple-system, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--sans);
    overflow: hidden; display: flex; flex-direction: column;
  }

  /* ---- ambient backdrop: starfield + grid + vignette ---- */
  .backdrop { position: fixed; inset: 0; z-index: -1; }
  .stars, .stars2 {
    position: absolute; inset: -50%;
    background-image:
      radial-gradient(1px 1px at 12% 24%, rgba(180,200,255,.55) 50%, transparent 51%),
      radial-gradient(1px 1px at 34% 71%, rgba(180,200,255,.4) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 56% 12%, rgba(140,190,255,.45) 50%, transparent 51%),
      radial-gradient(1px 1px at 71% 49%, rgba(180,200,255,.5) 50%, transparent 51%),
      radial-gradient(1px 1px at 88% 82%, rgba(180,200,255,.35) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 23% 88%, rgba(140,190,255,.4) 50%, transparent 51%),
      radial-gradient(1px 1px at 45% 42%, rgba(180,200,255,.3) 50%, transparent 51%),
      radial-gradient(1px 1px at 92% 18%, rgba(180,200,255,.45) 50%, transparent 51%);
    background-size: 640px 640px;
    animation: drift 240s linear infinite;
  }
  .stars2 { background-size: 940px 940px; opacity: .6; animation-duration: 380s; animation-direction: reverse; }
  @keyframes drift { to { transform: translate3d(640px, 320px, 0); } }
  .grid-layer {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(98, 208, 232, 0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(98, 208, 232, 0.045) 1px, transparent 1px);
    background-size: 72px 72px;
    mask-image: radial-gradient(ellipse 90% 80% at 50% 45%, black 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse 90% 80% at 50% 45%, black 30%, transparent 75%);
  }
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 75% 65% at 50% 42%, transparent 55%, rgba(0,0,0,.55) 100%);
  }

  /* ---- top bar ---- */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.1rem 2rem 0.6rem; gap: 2rem; flex: none;
  }
  .wordmark { display: flex; align-items: baseline; gap: 0.9rem; min-width: 0; }
  .wordmark h1 {
    font-size: clamp(1.4rem, 2.2vw, 2.1rem); font-weight: 700; letter-spacing: 0.42em;
    background: linear-gradient(100deg, var(--ink) 20%, var(--accent) 60%, var(--accent2) 90%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    white-space: nowrap;
  }
  .wordmark .greek { font-family: var(--mono); color: var(--faint); font-size: 0.8rem; letter-spacing: 0.3em; white-space: nowrap; }
  .clock { text-align: center; }
  .clock .time {
    font-family: var(--mono); font-weight: 600; line-height: 1;
    font-size: clamp(2.2rem, 4.5vw, 4rem); letter-spacing: 0.06em;
    text-shadow: 0 0 24px rgba(98, 208, 232, 0.35);
  }
  .clock .time .sec { color: var(--accent); font-size: 0.55em; }
  .clock .date {
    color: var(--muted); letter-spacing: 0.34em; text-transform: uppercase;
    font-size: clamp(0.6rem, 0.95vw, 0.85rem); margin-top: 0.35rem;
  }
  .pulse-meta { text-align: right; font-family: var(--mono); font-size: 0.72rem; color: var(--muted); line-height: 1.7; white-space: nowrap; }
  .pulse-meta .live { display: inline-flex; align-items: center; gap: 0.45rem; letter-spacing: 0.25em; font-weight: 600; }
  .pulse-meta .live .beat {
    width: 9px; height: 9px; border-radius: 50%; background: var(--ok);
    box-shadow: 0 0 10px var(--ok); animation: beat 2.2s ease-in-out infinite;
  }
  .pulse-meta .live.stale { color: var(--warn); }
  .pulse-meta .live.stale .beat { background: var(--warn); box-shadow: 0 0 10px var(--warn); animation: none; }
  @keyframes beat { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.55); opacity: 0.5; } }

  /* ---- alert banner: only exists when something is wrong ---- */
  .alertbar {
    display: none; margin: 0.2rem 2rem 0; padding: 0.45rem 1rem;
    border: 1px solid rgba(255, 93, 93, 0.5); border-radius: 3px;
    background: rgba(255, 93, 93, 0.08);
    font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.12em;
    color: var(--bad); text-align: center;
    animation: alertglow 2.4s ease-in-out infinite;
  }
  .alertbar.show { display: block; }
  .alertbar .sep { color: var(--faint); margin: 0 0.8rem; }
  @keyframes alertglow {
    0%, 100% { box-shadow: 0 0 12px rgba(255, 93, 93, 0.12); }
    50% { box-shadow: 0 0 26px rgba(255, 93, 93, 0.32); }
  }

  /* ---- main stage ---- */
  main {
    flex: 1; display: flex; align-items: center; justify-content: center;
    gap: 1.2rem; padding: 0 1.6rem; min-height: 0;
  }
  .col { display: flex; flex-direction: column; gap: 1rem; flex: 1 1 0; max-width: 27rem; min-width: 0; }
  .orbit-wrap { flex: 0 0 auto; width: min(44vw, 78vh); position: relative; }
  .orbit-wrap svg { width: 100%; height: auto; display: block; }

  /* ---- repo panels ---- */
  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
    padding: 0.95rem 1.1rem; position: relative; overflow: hidden;
    box-shadow: 0 0 40px rgba(0, 0, 0, 0.45);
  }
  .panel::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--line-bright), transparent);
  }
  .panel .head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin-bottom: 0.15rem; }
  .panel .name { font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; font-size: 0.95rem; }
  .panel .role { font-family: var(--mono); color: var(--faint); font-size: 0.62rem; letter-spacing: 0.2em; text-transform: uppercase; }
  .statusline { display: flex; align-items: center; gap: 0.5rem; font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.22em; margin-bottom: 0.6rem; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .s-green  { color: var(--ok); }      .s-green .dot  { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .s-red    { color: var(--bad); }     .s-red .dot    { background: var(--bad); box-shadow: 0 0 8px var(--bad); animation: beat 1.1s infinite; }
  .s-unknown{ color: var(--unknown); } .s-unknown .dot{ background: var(--unknown); }
  .s-dormant{ color: var(--warn); }    .s-dormant .dot{ background: var(--warn); }
  .vitals { display: grid; grid-template-columns: repeat(auto-fit, minmax(6.4rem, 1fr)); gap: 0.55rem 0.9rem; margin: 0.4rem 0 0.6rem; }
  .vital .v { font-family: var(--mono); font-weight: 600; font-size: clamp(1.05rem, 1.5vw, 1.5rem); line-height: 1.1; }
  .vital .v.neg { color: var(--bad); } .vital .v.pos { color: var(--ok); }
  .vital .l { color: var(--muted); font-size: 0.58rem; letter-spacing: 0.16em; text-transform: uppercase; margin-top: 0.15rem; }
  .wfrow { display: flex; flex-wrap: wrap; gap: 0.3rem 0.8rem; margin-bottom: 0.5rem; }
  .wf { display: inline-flex; align-items: center; gap: 0.35rem; font-family: var(--mono); font-size: 0.6rem; color: var(--muted); }
  .wf .dot { width: 6px; height: 6px; }
  .wf.ok .dot { background: var(--ok); } .wf.fail .dot { background: var(--bad); box-shadow: 0 0 6px var(--bad); }
  .wf.na .dot { background: var(--faint); }
  .wf.fail { color: var(--bad); }
  .commitline { font-family: var(--mono); font-size: 0.64rem; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .commitline .sha { color: var(--accent2); }
  .commitline .ago { color: var(--muted); }
  .panel .errline { font-family: var(--mono); font-size: 0.66rem; color: var(--bad); margin-bottom: 0.4rem; }

  /* ---- bottom: dormant strip + ticker ---- */
  footer { flex: none; }
  .stub-strip { display: flex; justify-content: center; gap: 1.4rem; padding: 0.45rem 2rem 0.55rem; }
  .stub {
    display: inline-flex; align-items: center; gap: 0.5rem; font-family: var(--mono);
    font-size: 0.62rem; letter-spacing: 0.2em; color: var(--faint); text-transform: uppercase;
  }
  .stub .dot { width: 6px; height: 6px; background: var(--warn); opacity: 0.55; }
  .ticker {
    border-top: 1px solid var(--line); background: rgba(8, 11, 18, 0.85);
    overflow: hidden; padding: 0.5rem 0; position: relative;
  }
  .ticker::before, .ticker::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 8rem; z-index: 1; pointer-events: none;
  }
  .ticker::before { left: 0; background: linear-gradient(90deg, var(--bg), transparent); }
  .ticker::after  { right: 0; background: linear-gradient(-90deg, var(--bg), transparent); }
  .ticker-track { display: inline-flex; gap: 3.5rem; white-space: nowrap; animation: ticker 90s linear infinite; will-change: transform; }
  @keyframes ticker { to { transform: translateX(-50%); } }
  .tick { font-family: var(--mono); font-size: 0.7rem; color: var(--muted); }
  .tick .repo { color: var(--accent); letter-spacing: 0.1em; }
  .tick .ago { color: var(--faint); }

  /* ---- orbital svg ---- */
  .ring-spin   { animation: spin 90s linear infinite; transform-origin: 50% 50%; }
  .ring-spin-r { animation: spin 140s linear infinite reverse; transform-origin: 50% 50%; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .core-pulse { animation: corepulse 4s ease-in-out infinite; transform-origin: 50% 50%; }
  @keyframes corepulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
  .flow { stroke-dasharray: 3 9; animation: flow 2.8s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -12; } }
  .node-label { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.18em; fill: var(--ink); }
  .node-sub   { font-family: var(--mono); font-size: 7.5px; letter-spacing: 0.14em; }
  .core-title { font-family: var(--sans); font-weight: 700; font-size: 15px; letter-spacing: 0.5em; fill: var(--ink); }
  .core-stat  { font-family: var(--mono); font-size: 8.5px; letter-spacing: 0.22em; fill: var(--muted); }
  .core-num   { font-family: var(--mono); font-weight: 600; font-size: 20px; }

  /* ---- no-signal state ---- */
  .nosignal {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 1rem; background: var(--bg); z-index: 10; text-align: center;
  }
  .nosignal.show { display: flex; }
  .nosignal h2 { font-family: var(--mono); letter-spacing: 0.5em; color: var(--bad); font-size: 1.4rem; }
  .nosignal p { font-family: var(--mono); color: var(--muted); font-size: 0.75rem; max-width: 40rem; line-height: 1.8; }
  @media (prefers-reduced-motion: reduce) {
    .stars, .stars2, .ring-spin, .ring-spin-r, .flow, .ticker-track, .beat, .core-pulse { animation: none !important; }
  }
</style>
</head>
<body>
<div class="backdrop"><div class="stars"></div><div class="stars2"></div><div class="grid-layer"></div><div class="vignette"></div></div>

<header>
  <div class="wordmark"><h1>ALETHEIA</h1><span class="greek">ἀλήθεια · UNCONCEALMENT</span></div>
  <div class="clock"><div class="time" id="time">--:--<span class="sec">:--</span></div><div class="date" id="date">&nbsp;</div></div>
  <div class="pulse-meta">
    <div class="live" id="live"><span class="beat"></span><span id="live-word">ACQUIRING</span></div>
    <div id="meta-line">awaiting pulse…</div>
  </div>
</header>

<div class="alertbar" id="alertbar"></div>

<main>
  <div class="col" id="col-left"></div>
  <div class="orbit-wrap"><svg id="orbit" viewBox="0 0 520 520" role="img" aria-label="Fleet orbital map"></svg></div>
  <div class="col" id="col-right"></div>
</main>

<footer>
  <div class="stub-strip" id="stubs"></div>
  <div class="ticker"><div class="ticker-track" id="ticker"></div></div>
</footer>

<div class="nosignal" id="nosignal">
  <h2>NO SIGNAL</h2>
  <p id="nosignal-why"></p>
</div>

<script>
"use strict";
const SRC = new URLSearchParams(location.search).get("src") || "../state/pulse/latest.json";
const REFRESH_MS = 5 * 60 * 1000;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* status vocabulary: a word always rides with the color */
const STATUS = {
  green:   { cls: "s-green",   word: "OPERATIONAL" },
  red:     { cls: "s-red",     word: "FAULT" },
  unknown: { cls: "s-unknown", word: "NO TELEMETRY" },
  dormant: { cls: "s-dormant", word: "DORMANT" },
};
const COLOR = { green: "var(--ok)", red: "var(--bad)", unknown: "var(--unknown)", dormant: "var(--warn)" };

function ago(iso) {
  if (!iso) return "";
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (!isFinite(s)) return "";
  if (s < 90) return "just now";
  if (s < 5400) return Math.round(s / 60) + "m ago";
  if (s < 129600) return Math.round(s / 3600) + "h ago";
  return Math.round(s / 86400) + "d ago";
}
function fmtVital(v) {
  if ("error" in v) return { text: "—", cls: "" };
  let val = v.value, cls = "";
  if (typeof val === "number") {
    if (v.unit === "usd") { cls = val < 0 ? "neg" : "pos"; val = (val < 0 ? "-$" : "$") + Math.abs(val).toLocaleString(undefined, { maximumFractionDigits: 2 }); }
    else if (v.unit === "%") val = val + "%";
    else val = val.toLocaleString();
  }
  return { text: String(val), cls };
}

/* ---------- clock ---------- */
function tickClock() {
  const now = new Date();
  const hh = String(now.getHours()).padStart(2, "0");
  const mm = String(now.getMinutes()).padStart(2, "0");
  const ss = String(now.getSeconds()).padStart(2, "0");
  document.getElementById("time").innerHTML = `${hh}:${mm}<span class="sec">:${ss}</span>`;
  document.getElementById("date").textContent = now.toLocaleDateString(undefined,
    { weekday: "long", year: "numeric", month: "long", day: "numeric" });
}
setInterval(tickClock, 1000); tickClock();

/* ---------- panels ---------- */
function panelHTML(r) {
  const st = STATUS[r.health] || STATUS.unknown;
  const vitals = (r.vitals || []).map(v => {
    const f = fmtVital(v);
    return `<div class="vital"><div class="v ${f.cls}">${esc(f.text)}</div><div class="l">${esc(v.label)}</div></div>`;
  }).join("");
  const wfs = Object.entries(r.workflows || {}).map(([name, w]) => {
    const short = name.replace(/\.yml$/, "");
    if (w.error) return `<span class="wf na"><span class="dot"></span>${esc(short)}</span>`;
    const ok = w.conclusion === "success" || w.conclusion === "skipped";
    return `<span class="wf ${w.conclusion ? (ok ? "ok" : "fail") : "na"}"><span class="dot"></span>${esc(short)}</span>`;
  }).join("");
  const c = r.commit;
  return `<section class="panel">
    <div class="head"><span class="name">${esc(r.github)}</span><span class="role">${esc(r.role)}</span></div>
    <div class="statusline ${st.cls}"><span class="dot"></span>${st.word}</div>
    ${r.error ? `<div class="errline">SIGNAL LOST · ${esc(r.error)}</div>` : ""}
    ${vitals ? `<div class="vitals">${vitals}</div>` : ""}
    ${wfs ? `<div class="wfrow">${wfs}</div>` : ""}
    ${c ? `<div class="commitline"><span class="sha">${esc(c.sha)}</span> ${esc(c.message)} <span class="ago">· ${ago(c.date)}</span></div>` : ""}
  </section>`;
}

/* ---------- orbital map ---------- */
function orbitSVG(pulse) {
  const cx = 260, cy = 260;
  const entries = Object.entries(pulse.repos);
  const hub = entries.find(([id]) => id === "aletheia");
  const actives = entries.filter(([id, r]) => id !== "aletheia" && r.status === "active");
  const stubs = entries.filter(([, r]) => r.status === "stub");
  const faults = entries.filter(([, r]) => r.health === "red").length;
  const hubHealth = hub ? hub[1].health : "unknown";

  let s = "";
  /* static rings */
  s += `<circle cx="${cx}" cy="${cy}" r="150" fill="none" stroke="var(--line)" stroke-width="1"/>`;
  s += `<circle cx="${cx}" cy="${cy}" r="228" fill="none" stroke="var(--line)" stroke-width="1" stroke-dasharray="1 5"/>`;
  /* rotating instrument rings */
  s += `<g class="ring-spin"><circle cx="${cx}" cy="${cy}" r="176" fill="none" stroke="var(--line-bright)" stroke-width="1" stroke-dasharray="40 320"/>
        <circle cx="${cx}" cy="${cy}" r="176" fill="none" stroke="var(--accent)" stroke-width="1" stroke-dasharray="8 640" opacity="0.8"/></g>`;
  s += `<g class="ring-spin-r"><circle cx="${cx}" cy="${cy}" r="200" fill="none" stroke="var(--line-bright)" stroke-width="1" stroke-dasharray="18 180"/></g>`;

  const place = (list, r0) => list.map(([id, rec], i) => {
    const a = (-90 + (360 / list.length) * i) * Math.PI / 180;
    return [id, rec, cx + r0 * Math.cos(a), cy + r0 * Math.sin(a)];
  });

  /* connection lines first (under nodes) */
  for (const [, rec, x, y] of [...place(actives, 150), ...place(stubs, 228)]) {
    const bright = rec.status === "active";
    s += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="${COLOR[rec.health]}" stroke-width="1" opacity="${bright ? 0.35 : 0.12}"/>`;
    if (bright) s += `<line class="flow" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--accent)" stroke-width="1.2" opacity="0.5"/>`;
  }
  /* nodes */
  for (const [, rec, x, y] of place(actives, 150)) {
    const col = COLOR[rec.health];
    const st = STATUS[rec.health] || STATUS.unknown;
    s += `<g><circle cx="${x}" cy="${y}" r="14" fill="var(--bg)" stroke="${col}" stroke-width="1.5"/>
      <circle cx="${x}" cy="${y}" r="6" fill="${col}"><animate attributeName="opacity" values="1;0.45;1" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="${x}" cy="${y}" r="20" fill="none" stroke="${col}" stroke-width="0.6" opacity="0.35"/>`;
    const above = y <= cy;
    const ty = above ? y - 32 : y + 40;
    s += `<text class="node-label" x="${x}" y="${ty}" text-anchor="middle">${esc(rec.github.toUpperCase())}</text>
      <text class="node-sub" x="${x}" y="${ty + 11}" text-anchor="middle" fill="${col}">${st.word}</text></g>`;
  }
  for (const [, rec, x, y] of place(stubs, 228)) {
    s += `<g opacity="0.55"><circle cx="${x}" cy="${y}" r="4.5" fill="var(--bg)" stroke="var(--warn)" stroke-width="1"/>
      <text class="node-sub" x="${x}" y="${y <= cy ? y - 11 : y + 16}" text-anchor="middle" fill="var(--faint)">${esc(rec.github.toUpperCase())}</text></g>`;
  }

  /* the core — Aletheia itself */
  const hcol = COLOR[hubHealth];
  s += `<g class="core-pulse"><circle cx="${cx}" cy="${cy}" r="86" fill="none" stroke="var(--accent)" stroke-width="0.7" opacity="0.5"/></g>
    <circle cx="${cx}" cy="${cy}" r="72" fill="rgba(10,15,24,0.92)" stroke="var(--line-bright)" stroke-width="1"/>
    <circle cx="${cx}" cy="${cy}" r="72" fill="none" stroke="${hcol}" stroke-width="1" stroke-dasharray="6 10" opacity="0.6"/>
    <text class="core-title" x="${cx + 4}" y="${cy - 18}" text-anchor="middle">ALETHEIA</text>
    <text class="core-num" x="${cx}" y="${cy + 10}" text-anchor="middle" fill="${faults ? "var(--bad)" : "var(--ok)"}">${faults ? faults + " FAULT" + (faults > 1 ? "S" : "") : "NOMINAL"}</text>
    <text class="core-stat" x="${cx}" y="${cy + 30}" text-anchor="middle">${actives.length + (hub ? 1 : 0)} ACTIVE · ${stubs.length} DORMANT</text>`;
  const openPlans = (pulse.plans || {}).open || 0;
  const liveTasks = (pulse.tasks || {}).live || 0;
  const motion = [];
  if (openPlans) motion.push(`${openPlans} PLAN${openPlans > 1 ? "S" : ""}`);
  if (liveTasks) motion.push(`${liveTasks} TASK${liveTasks > 1 ? "S" : ""}`);
  if (motion.length) s += `<text class="core-stat" x="${cx}" y="${cy + 44}" text-anchor="middle" fill="var(--accent)">${motion.join(" · ")} IN MOTION</text>`;
  document.getElementById("orbit").innerHTML = s;
}

/* ---------- ticker ---------- */
function tickerHTML(pulse) {
  const items = [];
  for (const r of Object.values(pulse.repos)) {
    for (const c of r.commits || []) {
      items.push({ repo: r.github, msg: c.message, date: c.date });
    }
  }
  items.sort((a, b) => new Date(b.date) - new Date(a.date));
  const html = items.slice(0, 24).map(i =>
    `<span class="tick"><span class="repo">${esc(i.repo.toUpperCase())}</span> ${esc(i.msg)} <span class="ago">· ${ago(i.date)}</span></span>`
  ).join("");
  /* duplicated for a seamless loop */
  document.getElementById("ticker").innerHTML = html + html;
}

/* ---------- assembly ---------- */
function render(pulse) {
  const actives = Object.entries(pulse.repos).filter(([, r]) => r.status === "active");
  const stubs = Object.values(pulse.repos).filter(r => r.status === "stub");
  const left = document.getElementById("col-left"), right = document.getElementById("col-right");
  left.innerHTML = ""; right.innerHTML = "";
  /* hub panel rides last so the working repos lead */
  const ordered = [...actives.filter(([id]) => id !== "aletheia"), ...actives.filter(([id]) => id === "aletheia")];
  ordered.forEach(([, r], i) => (i % 2 ? right : left).insertAdjacentHTML("beforeend", panelHTML(r)));
  document.getElementById("stubs").innerHTML = stubs.map(r =>
    `<span class="stub"><span class="dot"></span>${esc(r.github)} · dormant</span>`).join("");
  orbitSVG(pulse);
  tickerHTML(pulse);

  /* alert banner — present only when the pulse carries alerts */
  const alerts = pulse.alerts || [];
  const bar = document.getElementById("alertbar");
  bar.classList.toggle("show", alerts.length > 0);
  bar.innerHTML = alerts.map(a => {
    const why = a.failing ? a.failing.join(", ") : (a.error ? "unreachable" : (a.missing ? "missing state" : "fault"));
    return `⚠ ${esc(a.github.toUpperCase())} — ${esc(why)}`;
  }).join('<span class="sep">│</span>');

  const ageMs = Date.now() - new Date(pulse.generated_at).getTime();
  const stale = !isFinite(ageMs) || ageMs > 12 * 3600 * 1000;
  const live = document.getElementById("live");
  live.classList.toggle("stale", stale);
  document.getElementById("live-word").textContent = stale ? "PULSE STALE" : "LIVE";
  document.getElementById("meta-line").textContent =
    `pulse ${ago(pulse.generated_at) || pulse.generated_at} · registry rev ${pulse.fleet_revision} · ${pulse.source}`;
}

async function load() {
  try {
    const bust = SRC + (SRC.includes("?") ? "&" : "?") + "t=" + Date.now();
    const resp = await fetch(bust, { cache: "no-store" });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    render(await resp.json());
    document.getElementById("nosignal").classList.remove("show");
  } catch (err) {
    document.getElementById("nosignal-why").textContent =
      `could not read ${SRC} — ${err.message}. serve the repo root (python -m http.server) ` +
      `or enable github pages; file:// blocks fetch. override the source with ?src=<url>.`;
    document.getElementById("nosignal").classList.add("show");
  }
}
load();
setInterval(load, REFRESH_MS);
</script>
<script src="voice.js"></script>
</body>
