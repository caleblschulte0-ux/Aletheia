<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALETHEIA — command</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* Command Center V1 — interactive sibling of the wall. Served by the
     local Core (python -m aletheia.core); every button is a POST to
     /api/command, the same gated grammar the intercom speaks. */
  :root {
    --bg:#04060b; --panel:rgba(13,18,28,.85); --line:rgba(96,118,156,.22);
    --ink:#dfe6f2; --muted:#7d8aa3; --faint:#4a5670; --accent:#62d0e8;
    --accent2:#7c96ff; --ok:#35d07f; --bad:#ff5d5d; --warn:#d9a53f;
    --sans:"Space Grotesk",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh;
       display:flex;flex-direction:column}
  header{display:flex;align-items:center;justify-content:space-between;
         padding:1rem 1.6rem;border-bottom:1px solid var(--line)}
  h1{font-size:1.15rem;letter-spacing:.4em;font-weight:700}
  h1 span{color:var(--muted);font-weight:300;letter-spacing:.2em;font-size:.75rem}
  .haltwrap{display:flex;align-items:center;gap:.9rem;font-family:var(--mono);font-size:.7rem}
  #halt-state{letter-spacing:.25em}
  #halt-state.ok{color:var(--ok)} #halt-state.halted{color:var(--bad);animation:blink 1.2s infinite}
  @keyframes blink{50%{opacity:.4}}
  button{font-family:var(--mono);font-size:.68rem;letter-spacing:.12em;cursor:pointer;
         background:transparent;color:var(--ink);border:1px solid var(--line);
         border-radius:3px;padding:.38rem .8rem}
  button:hover{border-color:var(--accent);color:var(--accent)}
  button.danger{border-color:rgba(255,93,93,.5);color:var(--bad)}
  button.danger:hover{background:rgba(255,93,93,.12)}
  button.good{border-color:rgba(53,208,127,.5);color:var(--ok)}
  main{flex:1;display:grid;grid-template-columns:1.1fr .9fr;gap:1rem;padding:1rem 1.6rem;
       align-items:start}
  @media (max-width:900px){main{grid-template-columns:1fr}}
  section{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:1rem}
  section h2{font-size:.72rem;letter-spacing:.3em;color:var(--muted);margin-bottom:.7rem;
             text-transform:uppercase}
  .row{display:flex;justify-content:space-between;align-items:center;gap:.8rem;
       padding:.4rem 0;border-bottom:1px solid rgba(96,118,156,.1);font-size:.78rem}
  .row:last-child{border-bottom:0}
  .row .id{font-family:var(--mono);color:var(--accent2);font-size:.68rem}
  .row .st{font-family:var(--mono);font-size:.6rem;letter-spacing:.15em;color:var(--muted);
           white-space:nowrap}
  .row .st.PENDING{color:var(--warn)} .row .st.WAITING_EXTERNAL{color:var(--warn)}
  .row .st.RUNNING{color:var(--accent)} .row .st.BLOCKED{color:var(--bad)}
  .empty{color:var(--faint);font-family:var(--mono);font-size:.7rem}
  form{display:grid;gap:.6rem}
  select,input,textarea{background:rgba(4,6,11,.8);border:1px solid var(--line);
    border-radius:3px;color:var(--ink);font-family:var(--mono);font-size:.75rem;
    padding:.45rem .6rem;width:100%}
  select:focus,input:focus,textarea:focus{outline:none;border-color:var(--accent)}
  label{font-family:var(--mono);font-size:.6rem;letter-spacing:.2em;color:var(--muted);
        text-transform:uppercase}
  #args{display:grid;gap:.6rem}
  #receipts{font-family:var(--mono);font-size:.68rem;display:flex;flex-direction:column-reverse;
            gap:.4rem;max-height:16rem;overflow-y:auto}
  .rc .o{letter-spacing:.15em}
  .rc .o.done{color:var(--ok)} .rc .o.refused,.rc .o.error,.rc .o.invalid{color:var(--bad)}
  .rc .o.halted{color:var(--warn)}
  .rc .d{color:var(--muted)}
  footer{padding:.6rem 1.6rem;color:var(--faint);font-family:var(--mono);font-size:.62rem;
         border-top:1px solid var(--line)}
</style>
</head>
<body>
<header>
  <h1>ALETHEIA <span>COMMAND</span></h1>
  <div class="haltwrap">
    <span id="halt-state" class="ok">CHECKING…</span>
    <button id="halt-btn" class="danger" onclick="toggleHalt()">HALT</button>
    <a href="/" style="color:var(--muted);font-family:var(--mono);font-size:.65rem">→ the wall</a>
  </div>
</header>

<main>
  <div style="display:grid;gap:1rem">
    <section>
      <h2>Approvals pending</h2>
      <div id="approvals" class="empty">loading…</div>
    </section>
    <section>
      <h2>Notifications</h2>
      <div id="notifications" class="empty">loading…</div>
    </section>
    <section>
      <h2>Tasks</h2>
      <div id="tasks" class="empty">loading…</div>
    </section>
  </div>
  <div style="display:grid;gap:1rem">
    <section>
      <h2>Say what you want</h2>
      <!-- The primary input. Everything this system learned to do this week
           is reachable from one sentence: it compiles to gated steps and
           anything world-touching still asks. Burying that as one option in
           a 41-item dropdown made the screen worse than the microphone. -->
      <form id="ask-form" onsubmit="return sendAsk(event)">
        <textarea id="ask" rows="3" placeholder="Set up a meeting with Dana next week&#10;What am I paying for?&#10;Remind me at five to call the dentist"
                  style="width:100%;background:#0b0f16;color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:.6rem;font-family:var(--sans);font-size:.9rem;resize:vertical"></textarea>
        <button type="submit" style="margin-top:.5rem">ASK</button>
        <div id="ask-note" class="empty" style="margin-top:.4rem"></div>
      </form>
    </section>
    <section>
      <h2>Still needed from you</h2>
      <div id="setup" class="empty">checking…</div>
    </section>
    <details>
      <summary style="cursor:pointer;color:var(--muted);font-family:var(--mono);font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;padding:.4rem 0">Exact command</summary>
      <form id="cmd-form" onsubmit="return sendCommand(event)">
        <div><label>kind</label><select id="kind" onchange="renderArgs()"></select></div>
        <div id="args"></div>
        <button type="submit" class="good">EXECUTE</button>
      </form>
    </section>
    </details>
    <section>
      <h2>Receipts</h2>
      <div id="receipts"></div>
    </section>
  </div>
</main>
<footer>local Core · every command runs through the same registry gates as the intercom · truth: /api/status</footer>

<script>
"use strict";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* mirror of aletheia.intercom.KIND_ARGS — [required, optional] */
// The command grammar comes from the Core (/api/kinds), which reads it
// straight from the intercom validator. No copy lives in this file — a
// hand-maintained KINDS map here once drifted the moment new kinds landed.
let KINDS = {};

function renderArgs() {
  const kind = document.getElementById("kind").value;
  const [req, opt] = KINDS[kind] || [[], []];
  document.getElementById("args").innerHTML =
    req.map(a => `<div><label>${a}</label><input name="${a}" required></div>`).join("") +
    opt.map(a => `<div><label>${a} (optional)</label><input name="${a}"></div>`).join("");
}

async function api(path, opts) {
  const r = await fetch(path, opts);
  const data = await r.json();
  if (!r.ok) throw new Error(data.detail || `request failed (${r.status})`);
  return data;
}

async function waitForFollowup(id, timeoutMs=110000) {
  const deadline = Date.now() + timeoutMs;
  while (Date.now() < deadline) {
    const result = await api(`/api/voice/followup?id=${encodeURIComponent(id)}`);
    if (result.state === "READY" || result.state === "FAILED") return result;
    if (result.state === "EXPIRED") throw new Error("The reply was interrupted. Please ask again.");
    await new Promise(resolve => setTimeout(resolve, 1000));
  }
  throw new Error("The reply took too long. It remains in Notifications when it finishes.");
}

async function post(cmd) {
  const res = await api("/api/command", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify(cmd),
  });
  const div = document.createElement("div");
  div.className = "rc";
  div.innerHTML = `<span class="o ${esc(res.outcome)}">${esc(res.outcome.toUpperCase())}</span>
    <span class="d">${esc(cmd.kind)} — ${esc(res.detail)}</span>`;
  document.getElementById("receipts").appendChild(div);
  refresh();
  return res;
}

async function sendAsk(ev) {
  ev.preventDefault();
  const box = document.getElementById("ask");
  const text = box.value.trim();
  if (!text) return false;
  const note = document.getElementById("ask-note");
  note.textContent = "thinking…";
  try {
    const first = await api("/api/ask", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({text}),
    });
    const result = first.followup_id
      ? await waitForFollowup(first.followup_id) : first;
    note.textContent = result.say || result.detail || "done";
    box.value = "";
    refresh();
  } catch (err) {
    note.textContent = err && err.message ? err.message : "The answer did not return. Please ask again.";
  }
  return false;
}

// The verifiers make real network attempts (an IMAP login, a request to the
// hub). The server caches for a minute; the page must not ask on every
// refresh tick regardless, or it queues work nobody is waiting for.
let setupCheckedAt = 0;
async function loadSetup(force) {
  if (!force && Date.now() - setupCheckedAt < 120000) return;
  setupCheckedAt = Date.now();
  const host = document.getElementById("setup");
  try {
    const r = await api("/api/setup");
    if (r.ready) { host.textContent = "Nothing — everything is configured."; return; }
    host.innerHTML = r.steps.filter(s => s.state !== "ok" && !s.optional).map(s =>
      `<div class="rc"><span class="o">${esc(s.minutes)}m</span>` +
      `<span class="d"><b>${esc(s.title)}</b> — ${esc(s.detail)}</span></div>`).join("")
      || "Nothing required — only optional extras left.";
  } catch (err) {
    host.textContent = "could not check: " + err.message;
  }
}

function sendCommand(ev) {
  ev.preventDefault();
  const kind = document.getElementById("kind").value;
  const cmd = { kind };
  for (const input of document.querySelectorAll("#args input")) {
    if (input.value.trim() !== "") {
      cmd[input.name] = input.name === "n" ? Number(input.value) : input.value;
    }
  }
  post(cmd);
  return false;
}

let haltedNow = false;
async function ack(id) {
  await api("/api/notifications/ack", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({id})});
  refresh();
}

async function toggleHalt() {
  await post(haltedNow ? {kind: "resume"} : {kind: "halt", reason: "operator pressed HALT"});
}

async function refresh() {
  try {
    const s = await api("/api/status");
    haltedNow = !!s.halted;
    const hs = document.getElementById("halt-state");
    hs.textContent = haltedNow ? "HALTED — " + esc(s.halted.reason || "") : "RUNNING";
    hs.className = haltedNow ? "halted" : "ok";
    document.getElementById("halt-btn").textContent = haltedNow ? "RESUME" : "HALT";
    document.getElementById("halt-btn").className = haltedNow ? "good" : "danger";

    loadSetup(false);
    const aps = await api("/api/approvals");
    const pending = aps.filter(a => a.state === "PENDING");
    document.getElementById("approvals").innerHTML = pending.length ? pending.map(a =>
      `<div class="row"><div><div>${esc(a.requested_action)}</div>
         <div class="id">${esc(a.id)}</div></div>
       <div style="display:flex;gap:.4rem">
         <button class="good" onclick='post({kind:"approve",id:"${esc(a.id)}"})'>APPROVE</button>
         <button class="danger" onclick='post({kind:"deny",id:"${esc(a.id)}",because:"denied from command center"})'>DENY</button>
       </div></div>`).join("") : `<div class="empty">nothing waiting on you</div>`;

    const ns = await api("/api/notifications?state=UNREAD");
    document.getElementById("notifications").innerHTML = ns.length ? ns.map(n =>
      `<div class="row"><div><div>${esc(n.title)}</div>
         <div class="id">${esc(n.body)}</div></div>
       <button class="good" onclick='ack("${esc(n.id)}")'>ACK</button></div>`).join("")
      : `<div class="empty">nothing to surface</div>`;

    const ts = await api("/api/tasks");
    const live = ts.filter(t => !["COMPLETED","CANCELLED","FAILED_TERMINAL"].includes(t.status));
    document.getElementById("tasks").innerHTML = live.length ? live.map(t =>
      `<div class="row"><div><div>${esc(t.description)}</div><div class="id">${esc(t.id)}</div></div>
       <span class="st ${esc(t.status)}">${esc(t.status)}</span></div>`).join("")
      : `<div class="empty">no live tasks</div>`;
  } catch (e) {
    document.getElementById("halt-state").textContent = "CORE UNREACHABLE";
    document.getElementById("halt-state").className = "halted";
  }
}

api("/api/kinds").then(kinds => {
  KINDS = kinds;
  document.getElementById("kind").innerHTML =
    Object.keys(KINDS).map(k => `<option>${k}</option>`).join("");
  renderArgs();
}).catch(() => {
  document.getElementById("kind").innerHTML = "<option>core unreachable</option>";
});
refresh();
setInterval(refresh, 5000);
</script>
<script src="voice.js"></script>
</body>
</html>
