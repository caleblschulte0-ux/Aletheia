<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#08090c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Thea">
<link rel="manifest" href="/interface/manifest.webmanifest">
<link rel="apple-touch-icon" href="/interface/icon.svg">
<title>Thea</title>
<style>
/* THE FRONT DOOR. One thing on it: talk to her.
   Everything else — approvals, tasks, the fleet, what she has been doing —
   lives one tap away on console.html. The reason for the split is that
   those are different moments: this is "I am walking and I want to say a
   thing", and that is "I am sitting down and want to see everything". A
   page that serves both serves neither. */
:root{
  --bg:#08090c; --ink:#f2f5f9; --dim:#8d97a6; --faint:#525b69;
  --accent:#7cc6ff; --ok:#5fd39a; --bad:#ff6f6f; --warn:#f2c14e;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
body{
  font:400 17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,system-ui,sans-serif;
  display:flex;flex-direction:column;
  min-height:100dvh; overscroll-behavior:none;
  padding:calc(var(--safe-t) + 10px) 22px calc(var(--safe-b) + 18px);
}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}

/* ---- a thin top rail: her state, and the way through ---------------- */
.rail{display:flex;align-items:center;gap:9px;flex:none;min-height:38px}
.orb{width:9px;height:9px;border-radius:50%;background:var(--faint);flex:none}
.orb.live{background:var(--ok)}
.orb.halted{background:var(--bad)}
.rail .state{font-size:13px;color:var(--faint);flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.more{
  display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:99px;
  font-size:13px;color:var(--dim);border:1px solid #1d222c;
}
.more:active{background:#11141a}
.more.needs{border-color:#5a4a1c;color:var(--warn)}
.badge{
  min-width:19px;height:19px;padding:0 5px;border-radius:99px;
  background:var(--warn);color:#100c02;font-size:11.5px;font-weight:800;
  display:none;place-items:center;
}
.more.needs .badge{display:grid}

/* ---- the middle: her answer, and the one button --------------------- */
main{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:34px;text-align:center;padding:8px 0;
}
#answer{
  font-size:21px;line-height:1.45;color:var(--ink);
  max-width:22ch;margin:0;min-height:1.45em;
  overflow-y:auto;max-height:38vh;
}
#answer.idle{color:var(--faint);font-size:19px}
#answer.err{color:var(--bad);font-size:17px}

.talk{
  width:152px;height:152px;border-radius:50%;flex:none;
  display:grid;place-items:center;position:relative;
  background:radial-gradient(circle at 50% 38%,#1b2husb 0,#141922 60%,#10141b 100%);
  background:radial-gradient(circle at 50% 38%,#1d2430 0,#141922 62%,#10141b 100%);
  border:1px solid #262e3a;
  box-shadow:0 12px 40px rgba(0,0,0,.5);
  transition:transform .12s;
}
.talk:active{transform:scale(.96)}
.talk .glyph{font-size:46px;line-height:1}
.talk .cap{position:absolute;bottom:-30px;font-size:13px;color:var(--faint);white-space:nowrap}
.talk.on{border-color:var(--bad);background:radial-gradient(circle at 50% 38%,#3a1c22 0,#20141a 70%)}
.talk.on::after{
  content:"";position:absolute;inset:-10px;border-radius:50%;
  border:2px solid var(--bad);opacity:.55;animation:ring 1.35s ease-out infinite;
}
.talk.thinking{border-color:var(--accent)}
.talk.thinking::after{
  content:"";position:absolute;inset:-10px;border-radius:50%;
  border:2px solid var(--accent);border-top-color:transparent;
  animation:spin 1s linear infinite;
}
@keyframes ring{to{transform:scale(1.22);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){
  .talk.on::after,.talk.thinking::after{animation:none}
}

/* ---- the bottom: typing, always available -------------------------- */
.typed{flex:none;display:flex;align-items:center;gap:9px;
  background:#11141a;border:1px solid #232a35;border-radius:26px;
  padding:5px 5px 5px 18px;margin-top:20px}
.typed input{flex:1;border:0;background:none;outline:none;min-width:0;
  padding:12px 0;font-size:16px}      /* 16px or iOS zooms on focus */
.typed input::placeholder{color:var(--faint)}
.send{width:42px;height:42px;border-radius:50%;flex:none;display:grid;
  place-items:center;background:var(--accent);color:#06121c;font-size:19px;font-weight:700}
.send:disabled{opacity:.3}
</style>
</head>
<body>

<div class="rail">
  <span id="orb" class="orb"></span>
  <span id="state" class="state">…</span>
  <a id="more" class="more" href="/interface/console.html">
    <span id="badge" class="badge">0</span>Everything
  </a>
</div>

<main>
  <p id="answer" class="idle">Tap and talk.</p>
  <button id="talk" class="talk" aria-label="Talk to Thea">
    <span class="glyph" id="glyph">&#127908;</span>
    <span class="cap" id="cap">hold nothing — just tap</span>
  </button>
</main>

<div class="typed">
  <input id="q" type="text" placeholder="…or type it"
         autocomplete="off" autocorrect="off" enterkeyhint="send">
  <button id="send" class="send" aria-label="Send">&#8593;</button>
</div>

<script src="/interface/thea.js"></script>
<script src="/interface/talk.js"></script>
</body>
</html>
